[package]
name = "bevy-platformer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", features = ["dynamic_linking"] }

# Fast iterative builds: optimize dependencies but keep our crate smooth to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3