[package]
name = "bevy-platformer"
version = "0.1.0"
edition = "2024"

[features]
default = ["dev"]
# Dev conveniences: fast incremental linking, asset hot reload, system/component
# names in ECS errors. Ship with `cargo build --release --no-default-features`.
dev = ["bevy/dynamic_linking", "bevy/file_watcher", "bevy/debug"]

[dependencies]
bevy = "0.19"
avian2d = "0.7"

# Fast iterative builds: optimize dependencies but keep our crate smooth to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
